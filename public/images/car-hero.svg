  <!-- Rear Taillight Rim Glow -->
  <path d="M876 206 L912 214 L908 230 L870 222 Z" fill="#FF4D36" fill-opacity="0.75"/>

  <!-- Front Alloy Wheel -->
  <g transform="translate(342, 304)">
    <circle cx="0" cy="0" r="52" fill="#06080A" stroke="#222830" stroke-width="4"/>
    <circle cx="0" cy="0" r="37" fill="#0D1116" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="9" fill="#1C222A" stroke="#FF5B45" stroke-opacity="0.6" stroke-width="1.5"/>
    <path d="M0 -36 L0 36 M-36 0 L36 0 M-25 -25 L25 25 M-25 25 L25 -25" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>
  </g>

  <!-- Rear Alloy Wheel -->
  <g transform="translate(778, 304)">
    <circle cx="0" cy="0" r="52" fill="#06080A" stroke="#222830" stroke-width="4"/>
    <circle cx="0" cy="0" r="37" fill="#0D1116" stroke="rgba(255,91,69,0.28)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="9" fill="#1C222A" stroke="#FF5B45" stroke-opacity="0.7" stroke-width="1.5"/>
    <path d="M0 -36 L0 36 M-36 0 L36 0 M-25 -25 L25 25 M-25 25 L25 -25" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
